syntax = "proto3";

package settings_iface.v1;

import "auth_iface/v1/policy.proto";

option go_package = "github.com/justmart/backend/gen/settings_iface/v1;settingsifacev1";

// App-wide settings (one row in app_settings per key). The table + proto are
// open for future keys.
message Settings {
  // Warn when a product's ready_stock in the active warehouse is <= this
  // number. Default 10 when no row exists yet.
  int32 low_stock_threshold = 1;
  // Shop / app title shown in the browser tab, the sidebar brand and the login
  // screen. Empty = fall back to the mode's built-in brand.
  string app_title = 2;
  // The shop's business mode (retail vs pharmacy). UNSPECIFIED behaves as
  // retail. Owner-editable in Settings ▸ General.
  BussinessType business_type = 3;
}

service SettingsService {
  rpc GetSettings(GetSettingsRequest) returns (GetSettingsResponse) {
    option (auth_iface.v1.allowed_roles) = ROLE_OWNER;
    option (auth_iface.v1.allowed_roles) = ROLE_PHARMACIST;
  }
  rpc UpdateSettings(UpdateSettingsRequest) returns (UpdateSettingsResponse) {
    option (auth_iface.v1.allowed_roles) = ROLE_OWNER;
  }

  // Readable by every authenticated role — the business mode drives branding,
  // navigation and POS behavior for all users (cashier + apoteker included).
  // Writing it is part of UpdateSettings (owner-only).
  rpc GetBussinessSettings(GetBussinessSettingsRequest) returns (GetBussinessSettingsResponse) {
    option (auth_iface.v1.allowed_roles) = ROLE_OWNER;
    option (auth_iface.v1.allowed_roles) = ROLE_PHARMACIST;
    option (auth_iface.v1.allowed_roles) = ROLE_CASHIER;
    option (auth_iface.v1.allowed_roles) = ROLE_APOTEKER;
  }

  // GetBranding exposes JUST the branding facts (business mode + app title)
  // needed to render the app chrome BEFORE the user authenticates — the login
  // screen + browser tab title. PUBLIC by design: the shop title + mode are the
  // storefront brand (already shown to anyone who reaches the login page), not
  // sensitive data. All richer settings RPCs stay role-gated.
  rpc GetBranding(GetBrandingRequest) returns (GetBrandingResponse) {
    option (auth_iface.v1.public) = true;
  }

  // GetPrintTarget / SetPrintTarget store the DEFAULT print connector + printer
  // (app_settings) used by SaleService.PrintReceipt when the request carries no
  // explicit target. Get is manager-tier (drives the Settings ▸ Printing panel);
  // Set is owner-only.
  rpc GetPrintTarget(GetPrintTargetRequest) returns (GetPrintTargetResponse) {
    option (auth_iface.v1.allowed_roles) = ROLE_OWNER;
    option (auth_iface.v1.allowed_roles) = ROLE_PHARMACIST;
  }
  rpc SetPrintTarget(SetPrintTargetRequest) returns (SetPrintTargetResponse) {
    option (auth_iface.v1.allowed_roles) = ROLE_OWNER;
  }

  // GetReceiptSettings / SetReceiptSettings store the printed-receipt header
  // (shop name/address lines) + footer (closing lines). Multi-line strings, one
  // receipt line per text line. Seeded at boot from config.yaml printer.header/
  // footer. Get is manager-tier; Set is owner-only.
  rpc GetReceiptSettings(GetReceiptSettingsRequest) returns (GetReceiptSettingsResponse) {
    option (auth_iface.v1.allowed_roles) = ROLE_OWNER;
    option (auth_iface.v1.allowed_roles) = ROLE_PHARMACIST;
  }
  rpc SetReceiptSettings(SetReceiptSettingsRequest) returns (SetReceiptSettingsResponse) {
    option (auth_iface.v1.allowed_roles) = ROLE_OWNER;
  }

  // GetPrintingInfo reports the active print mode (config connector.mode) plus,
  // in usb mode, the printers installed on the SERVER host (via the OS spooler;
  // empty off-Windows). Drives the mode-aware Settings ▸ Printing panel —
  // which picker to show and the usb local-printer options. Manager-tier.
  rpc GetPrintingInfo(GetPrintingInfoRequest) returns (GetPrintingInfoResponse) {
    option (auth_iface.v1.allowed_roles) = ROLE_OWNER;
    option (auth_iface.v1.allowed_roles) = ROLE_PHARMACIST;
  }

  // GetTunnelSettings / SetTunnelSettings store the Cloudflare Tunnel token
  // that makes this shop reachable on a public hostname without port
  // forwarding. OWNER-only in BOTH directions — unlike the printing settings
  // beside them, this is a credential that exposes the shop to the internet, so
  // even the manager tier does not read it. The token itself is never returned;
  // the response carries a masked preview.
  rpc GetTunnelSettings(GetTunnelSettingsRequest) returns (GetTunnelSettingsResponse) {
    option (auth_iface.v1.allowed_roles) = ROLE_OWNER;
  }
  rpc SetTunnelSettings(SetTunnelSettingsRequest) returns (SetTunnelSettingsResponse) {
    option (auth_iface.v1.allowed_roles) = ROLE_OWNER;
  }

  // CheckUpdate reports the running build version + the latest GitHub release
  // (autoupdater, portable Windows flavor). OWNER-only.
  rpc CheckUpdate(CheckUpdateRequest) returns (CheckUpdateResponse) {
    option (auth_iface.v1.allowed_roles) = ROLE_OWNER;
  }
  // ApplyUpdate downloads + verifies + stages the latest release; the launcher
  // swaps it in on next start. Windows + portable only. OWNER-only.
  rpc ApplyUpdate(ApplyUpdateRequest) returns (ApplyUpdateResponse) {
    option (auth_iface.v1.allowed_roles) = ROLE_OWNER;
  }
  // RevertUpdate stages the previous-version backup (justmart.exe.bak) so the
  // launcher rolls back on next start. Windows + portable only, local (no
  // network). OWNER-only.
  rpc RevertUpdate(RevertUpdateRequest) returns (RevertUpdateResponse) {
    option (auth_iface.v1.allowed_roles) = ROLE_OWNER;
  }
}

enum BussinessType {
  BUSSINESS_TYPE_UNSPECIFIED = 0;
  BUSSINESS_TYPE_PHARMACY_SHOP = 1;
  BUSSINESS_TYPE_RETAIL = 2;
}

message GetBussinessSettingsRequest {}

message GetBussinessSettingsResponse {
  BussinessType type = 1;   // the shop's configured business type (UNSPECIFIED when unset)
  string app_title = 2;     // configured shop/app title ("" when unset) — readable by all roles for branding
}

message GetBrandingRequest {}
message GetBrandingResponse {
  BussinessType business_type = 1;  // active mode (UNSPECIFIED behaves as retail)
  string app_title = 2;             // configured shop/app title ("" = built-in brand)
}

message GetSettingsRequest {}
message GetSettingsResponse {
  Settings settings = 1;
}

message UpdateSettingsRequest {
  int32 low_stock_threshold = 1;
  string app_title = 2;             // "" clears the override (built-in brand)
  BussinessType business_type = 3;  // UNSPECIFIED leaves the current mode unchanged
}
message UpdateSettingsResponse {
  Settings settings = 1;
}

message GetPrintTargetRequest {}
message GetPrintTargetResponse {
  string connector_device_id = 1; // saved default connector ("" = none)
  string printer_name = 2;        // saved default printer ("" = connector default)
}
message SetPrintTargetRequest {
  string connector_device_id = 1;
  string printer_name = 2;
}
message SetPrintTargetResponse {
  string connector_device_id = 1;
  string printer_name = 2;
}

message GetReceiptSettingsRequest {}
message GetReceiptSettingsResponse {
  string header = 1; // receipt header lines (one per text line)
  string footer = 2; // receipt footer lines (one per text line)
  int32 width = 3;   // chars per line: 32 = 58mm paper, 48 = 80mm paper
}
message SetReceiptSettingsRequest {
  string header = 1;
  string footer = 2;
  int32 width = 3;   // chars per line: 32 = 58mm paper, 48 = 80mm paper
}
message SetReceiptSettingsResponse {
  string header = 1;
  string footer = 2;
  int32 width = 3;
}

message GetPrintingInfoRequest {}
message GetPrintingInfoResponse {
  string mode = 1;                    // "tcp" | "connector" | "usb"
  repeated string local_printers = 2; // server-host printers (usb mode; empty off-Windows)
}

message GetTunnelSettingsRequest {}
// TunnelSettings is deliberately not a shared message with the request: what an
// OWNER can WRITE is one token, while what they need to SEE is why the server
// is (or is not) running one.
message GetTunnelSettingsResponse {
  bool configured = 1;        // a token is saved in Settings
  string token_preview = 2;   // masked ("eyJhIj••••In0="); "" when none. The raw token never leaves the server
  bool active = 3;            // this server booted with a tunnel running
  string source = 4;          // which token won: "none"|"settings"|"config"|"env"|"env_off"
  bool restart_required = 5;  // the saved token differs from the one this process booted on
  bool supported = 6;         // false off-Windows: cloudflared is fetched as a windows-amd64 exe today
}
message SetTunnelSettingsRequest {
  // The token, or "" to clear it. A pasted `cloudflared service install <token>`
  // command is accepted — the server takes the token out of it.
  string token = 1;
}
message SetTunnelSettingsResponse {
  bool configured = 1;
  string token_preview = 2;
  bool active = 3;
  string source = 4;
  bool restart_required = 5;
  bool supported = 6;
}

message CheckUpdateRequest {}
message CheckUpdateResponse {
  string current_version = 1;
  bool checked = 2;            // false = remote lookup failed (offline / 404 / rate-limited)
  bool update_available = 3;
  string latest_version = 4;
  string release_notes = 5;
  string release_url = 6;
  int64 published_at = 7;
  bool enabled = 8;            // false when update.disabled (UI shows "checks off")
  bool can_self_apply = 9;     // Windows + portable + release has zip + .sha256
  bool can_revert = 10;        // Windows + a justmart.exe.bak backup exists
  string backup_version = 11;  // version the backup holds ("" when unknown)
}

message ApplyUpdateRequest { bool restart = 1; } // restart=true → also relaunch
message ApplyUpdateResponse {
  string staged_version = 1;
  bool restarting = 2;
}

message RevertUpdateRequest {}
message RevertUpdateResponse { bool staged = 1; }
