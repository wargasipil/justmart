syntax = "proto3";

package inventory_iface.v1;

import "auth_iface/v1/policy.proto";
import "inventory_iface/v1/product_price_tier.proto";
import "inventory_iface/v1/product_recipe.proto";

option go_package = "github.com/justmart/backend/gen/inventory_iface/v1;inventoryifacev1";

// What selling one of this product costs the inventory. Stored as the bare
// string ('STOCKED'|'COMPOSITE'|'SERVICE') in products.product_kind, matching
// how users.role is stored — rows stay readable in psql.
//
// NOT gated on the business mode: a retail shop selling a gift bundle or
// repacking a sack needs COMPOSITE just as much as a warung does.
enum ProductKind {
  PRODUCT_KIND_UNSPECIFIED = 0;  // treated as STOCKED (the pre-existing default)
  PRODUCT_KIND_STOCKED = 1;      // the product IS the stock: a sale consumes its own batches
  PRODUCT_KIND_COMPOSITE = 2;    // assembled at sale time: consumes its recipe's components
  PRODUCT_KIND_SERVICE = 3;      // consumes nothing (corkage, delivery fee, plating charge)
}

message Product {
  reserved 4;
  reserved "manufacturer";
  string id = 1;
  string sku = 2;
  string name = 3;
  string unit = 5;
  int64 unit_price = 6;
  bool prescription_required = 7;
  bool active = 8;
  int64 created_at = 9;
  int64 ready_stock = 10;     // on-hand in the active warehouse (list enrich)
  int64 on_order_stock = 11;  // incoming on open POs (list enrich)
  string last_restock_date = 12;      // YYYY-MM-DD of most recent batch receive (GetProduct only)
  string last_restock_supplier = 13;  // supplier of that batch (GetProduct only)
  int64 total_stock = 14;             // on-hand in the active warehouse (GetProduct only; == ready_stock)
  int64 stock_valuation = 15;         // value at cost of ready_stock = Σ qty × cost_price, active warehouse (GetProduct only)
  repeated ProductUnit units = 16;   // units of measure (base + larger packs)
  int64 reference_cost = 17;          // latest batch cost_price, per base unit (GetProduct only; 0 if none)
  string last_stocktake_date = 18;    // YYYY-MM-DD of most recent COMPLETED stocktake touching this product in the active warehouse (GetProduct only; empty if none)
  int64 last_stocktake_variance = 19; // signed sum(counted_qty − expected_qty) for this product's lines in that session, BASE units (GetProduct only)
  // Latest restock across suppliers in the active warehouse (ListProducts enrich;
  // from product_last_restocks). All 0/empty until a receipt records one.
  int64 last_restock_price = 20;            // NET unit cost per base unit
  int64 last_restock_qty = 21;              // base units received
  string last_restock_discount_type = 22;  // FIXED | PERCENT
  int64 last_restock_discount_value = 23;   // FIXED minor units | PERCENT basis points
  int64 last_restock_created_at = 24;       // unix; PO (restock order) created
  int64 last_restock_arrived_at = 25;       // unix; receipt received_at
  string last_restock_supplier_id = 26;     // resolve to name via ResolveSuppliers
  // Grosir (wholesale) quantity price ladders, one set per sellable unit. Hydrated
  // on Get/List/Search so POS can hint the tier without a second RPC; tiers of an
  // archived unit are omitted.
  repeated ProductPriceTier price_tiers = 27;
  // Value at cost of on_order_stock: Σ outstanding_qty × NET per-base cost of the
  // PO line (same rate CreateReceipt stamps on the batch, so a line discount is
  // reflected and ongoing valuation lands where ready valuation will). Like
  // on_order_stock it is company-wide — purchase_order_items has no warehouse.
  int64 on_order_valuation = 28;
  // Unix sec of the product picture's last upload; 0 = no picture. The bytes
  // live in their own table and are fetched only by GetProductImage — this
  // marker is what tells the UI whether to fetch at all, and doubles as the
  // client cache key so a re-upload appears without an invalidate.
  int64 image_updated_at = 29;
  // What selling one costs the inventory. UNSPECIFIED reads as STOCKED so every
  // pre-existing product and every caller that never sets it keeps today's
  // behaviour exactly.
  ProductKind kind = 30;
  // The bill of materials, hydrated alongside units/price_tiers on Get/List/
  // Search — POS reads the catalog through ListProducts, so a Get-only
  // hydration would leave every menu item's availability hint blank. Empty for
  // a STOCKED or SERVICE product.
  repeated ProductRecipeItem recipe = 31;
}

// A unit of measure for a product. Stock is stored in the base unit (factor 1);
// larger units convert via `factor` (base units per 1 of this unit).
message ProductUnit {
  string id = 1;
  string product_id = 2;
  string name = 3;
  int64 factor = 4;          // base units per 1 of this unit (base = 1)
  bool is_base = 5;
  int64 sell_price = 6;      // independent, minor currency
  bool sellable = 7;
  bool purchasable = 8;      // Phase 2
  int32 sort_order = 9;
  bool active = 10;
}

message ProductUnitInput {
  string id = 1;             // empty = create new
  string name = 2;
  int64 factor = 3;
  bool is_base = 4;
  int64 sell_price = 5;
  bool sellable = 6;
  bool purchasable = 7;
  int32 sort_order = 8;
  bool active = 9;
}

message ProductPrice {
  string id = 1;
  string product_id = 2;
  int64 unit_price = 3;
  int64 effective_from = 4;
  int64 effective_to = 5;
  string changed_by = 6;
}

// Per-unit sell-price history (one open row per unit; effective_to 0 = current).
message ProductUnitPrice {
  string id = 1;
  string product_unit_id = 2;
  string unit_name = 3;          // denormalized for display
  int64 unit_sell_price = 4;
  int64 effective_from = 5;
  int64 effective_to = 6;        // 0 = open/current
  string changed_by = 7;
}

// One restock event from the append-only log (product-detail restock history).
// Supplier resolved to a name via ResolveSuppliers on the client.
message ProductRestockLog {
  string id = 1;
  string supplier_id = 2;
  int64 price = 3;              // NET unit cost per base unit
  int64 qty = 4;               // base units received
  string discount_type = 5;    // FIXED | PERCENT
  int64 discount_value = 6;     // FIXED minor units | PERCENT basis points
  int64 restock_created_at = 7; // unix; PO (restock order) created
  int64 restock_arrived_at = 8; // unix; receipt received_at
  bool discount_per_item = 9;   // when true, discount was applied per item (× qty)
}

service ProductService {
  rpc ListProducts(ListProductsRequest) returns (ListProductsResponse) {
    option (auth_iface.v1.allowed_roles) = ROLE_OWNER;
    option (auth_iface.v1.allowed_roles) = ROLE_PHARMACIST;
    option (auth_iface.v1.allowed_roles) = ROLE_CASHIER;
    option (auth_iface.v1.allowed_roles) = ROLE_APOTEKER;
  }
  rpc GetProduct(GetProductRequest) returns (GetProductResponse) {
    option (auth_iface.v1.allowed_roles) = ROLE_OWNER;
    option (auth_iface.v1.allowed_roles) = ROLE_PHARMACIST;
    option (auth_iface.v1.allowed_roles) = ROLE_CASHIER;
    option (auth_iface.v1.allowed_roles) = ROLE_APOTEKER;
  }
  rpc CreateProduct(CreateProductRequest) returns (CreateProductResponse) {
    option (auth_iface.v1.allowed_roles) = ROLE_OWNER;
    option (auth_iface.v1.allowed_roles) = ROLE_PHARMACIST;
  }
  // ImportProducts bulk-creates products from a parsed CSV (first-time offline
  // data migration). Best-effort, per-row results: existing SKUs are skipped,
  // invalid rows reported, valid rows created — one bad row never blocks the rest.
  rpc ImportProducts(ImportProductsRequest) returns (ImportProductsResponse) {
    option (auth_iface.v1.allowed_roles) = ROLE_OWNER;
    option (auth_iface.v1.allowed_roles) = ROLE_PHARMACIST;
  }
  rpc UpdateProduct(UpdateProductRequest) returns (UpdateProductResponse) {
    option (auth_iface.v1.allowed_roles) = ROLE_OWNER;
    option (auth_iface.v1.allowed_roles) = ROLE_PHARMACIST;
  }
  rpc ArchiveProduct(ArchiveProductRequest) returns (ArchiveProductResponse) {
    option (auth_iface.v1.allowed_roles) = ROLE_OWNER;
    option (auth_iface.v1.allowed_roles) = ROLE_PHARMACIST;
  }
  // UnarchiveProduct restores a soft-deleted product (active=false -> true).
  rpc UnarchiveProduct(UnarchiveProductRequest) returns (UnarchiveProductResponse) {
    option (auth_iface.v1.allowed_roles) = ROLE_OWNER;
    option (auth_iface.v1.allowed_roles) = ROLE_PHARMACIST;
  }
  rpc ListProductPrices(ListProductPricesRequest) returns (ListProductPricesResponse) {
    option (auth_iface.v1.allowed_roles) = ROLE_OWNER;
    option (auth_iface.v1.allowed_roles) = ROLE_PHARMACIST;
  }
  rpc ListProductUnitPrices(ListProductUnitPricesRequest) returns (ListProductUnitPricesResponse) {
    option (auth_iface.v1.allowed_roles) = ROLE_OWNER;
    option (auth_iface.v1.allowed_roles) = ROLE_PHARMACIST;
  }
  // ListProductRestockLogs returns the restock history (append-only log) for a
  // product in the caller's active warehouse, newest-arrival first, paginated.
  rpc ListProductRestockLogs(ListProductRestockLogsRequest) returns (ListProductRestockLogsResponse) {
    option (auth_iface.v1.allowed_roles) = ROLE_OWNER;
    option (auth_iface.v1.allowed_roles) = ROLE_PHARMACIST;
  }
  rpc SearchProducts(SearchProductsRequest) returns (SearchProductsResponse) {
    option (auth_iface.v1.allowed_roles) = ROLE_OWNER;
    option (auth_iface.v1.allowed_roles) = ROLE_PHARMACIST;
    option (auth_iface.v1.allowed_roles) = ROLE_CASHIER;
    option (auth_iface.v1.allowed_roles) = ROLE_APOTEKER;
  }
  // ResolveProducts returns minimal display refs for a set of ids (batch
  // lookup-by-IDs for name resolution; never a full-list preload).
  rpc ResolveProducts(ResolveProductsRequest) returns (ResolveProductsResponse) {
    option (auth_iface.v1.allowed_roles) = ROLE_OWNER;
    option (auth_iface.v1.allowed_roles) = ROLE_PHARMACIST;
    option (auth_iface.v1.allowed_roles) = ROLE_CASHIER;
    option (auth_iface.v1.allowed_roles) = ROLE_APOTEKER;
  }
  // ListLowStock returns active products whose ready_stock in the caller's
  // active warehouse is <= the low-stock threshold (Settings.low_stock_threshold).
  // Drives the TopBar bell.
  rpc ListLowStock(ListLowStockRequest) returns (ListLowStockResponse) {
    option (auth_iface.v1.allowed_roles) = ROLE_OWNER;
    option (auth_iface.v1.allowed_roles) = ROLE_PHARMACIST;
  }
  // UploadProductImage replaces a product's single picture (both renditions).
  // Catalog write, so it mirrors UpdateProduct's roles.
  rpc UploadProductImage(UploadProductImageRequest) returns (UploadProductImageResponse) {
    option (auth_iface.v1.allowed_roles) = ROLE_OWNER;
    option (auth_iface.v1.allowed_roles) = ROLE_PHARMACIST;
  }
  // GetProductImage returns ONE rendition. Open to every catalog reader —
  // POS renders the thumbnail in its search rows, so a cashier needs it.
  rpc GetProductImage(GetProductImageRequest) returns (GetProductImageResponse) {
    option (auth_iface.v1.allowed_roles) = ROLE_OWNER;
    option (auth_iface.v1.allowed_roles) = ROLE_PHARMACIST;
    option (auth_iface.v1.allowed_roles) = ROLE_CASHIER;
    option (auth_iface.v1.allowed_roles) = ROLE_APOTEKER;
  }
  rpc DeleteProductImage(DeleteProductImageRequest) returns (DeleteProductImageResponse) {
    option (auth_iface.v1.allowed_roles) = ROLE_OWNER;
    option (auth_iface.v1.allowed_roles) = ROLE_PHARMACIST;
  }
}

message ListProductsRequest {
  bool include_inactive = 1;
  int32 limit = 2;
  int32 offset = 3;
  string query = 4;          // optional ILIKE name / sku
  string opname_before = 5;  // YYYY-MM-DD. When set, include only products whose latest
                             // COMPLETED opname in the active warehouse is < this date OR
                             // who have never been counted there (overdue / never-counted).
  bool only_archived = 6;    // when true: return ONLY archived (active=false); overrides include_inactive.
}
message ListProductsResponse {
  repeated Product products = 1;
  int32 total = 2;
}

message GetProductRequest { string id = 1; }
message GetProductResponse { Product product = 1; }

message CreateProductRequest {
  reserved 3;
  reserved "manufacturer";
  string sku = 1;
  string name = 2;
  string unit = 4;            // base unit name (also used if `units` is empty)
  int64 unit_price = 5;       // base unit sell price
  bool prescription_required = 6;
  repeated ProductUnitInput units = 7;  // optional; if empty, a base unit is created from unit/unit_price
  ProductKind kind = 8;                 // UNSPECIFIED = STOCKED
}
message CreateProductResponse { Product product = 1; }

// Per-row outcome of a CSV import.
enum ImportProductStatus {
  IMPORT_PRODUCT_STATUS_UNSPECIFIED = 0;
  IMPORT_PRODUCT_STATUS_CREATED = 1;
  IMPORT_PRODUCT_STATUS_SKIPPED_DUPLICATE = 2; // a product with that SKU already exists
  IMPORT_PRODUCT_STATUS_ERROR = 3;             // validation / DB error (see message)
}
message ImportProductResult {
  int32 row = 1;                 // 0-based index into the request's products
  string sku = 2;
  ImportProductStatus status = 3;
  string product_id = 4;         // set when CREATED
  string message = 5;            // reason when ERROR
}
// Reuses CreateProductRequest as the row type — the client builds one per CSV row.
message ImportProductsRequest { repeated CreateProductRequest products = 1; }
message ImportProductsResponse {
  repeated ImportProductResult results = 1; // one per input row, in order
  int32 created = 2;
  int32 skipped = 3;
  int32 errored = 4;
}

message UpdateProductRequest {
  reserved 3;
  reserved "manufacturer";
  string id = 1;
  string name = 2;
  string unit = 4;
  int64 unit_price = 5;
  bool prescription_required = 6;
  repeated ProductUnitInput units = 7;  // upsert the full unit set (exactly one is_base, base factor 1)
  string sku = 8;                        // editable business code; unique (excludes self on update)
  // UNSPECIFIED = STOCKED. Switching AWAY from COMPOSITE while recipe lines
  // still exist is rejected — clear the recipe first, so a menu item can never
  // silently stop consuming its ingredients.
  ProductKind kind = 9;
}
message UpdateProductResponse { Product product = 1; }

message ArchiveProductRequest { string id = 1; }
message ArchiveProductResponse { Product product = 1; }

message UnarchiveProductRequest { string id = 1; }
message UnarchiveProductResponse { Product product = 1; }

message ListProductPricesRequest {
  string product_id = 1;
  int32 limit = 2;
  int32 offset = 3;
}
message ListProductPricesResponse {
  repeated ProductPrice prices = 1;
  int32 total = 2;
}

message ListProductUnitPricesRequest {
  string product_id = 1;
  int32 limit = 2;
  int32 offset = 3;
}
message ListProductUnitPricesResponse {
  repeated ProductUnitPrice prices = 1;
  int32 total = 2; // all price rows for the product, ignoring the page window
}

message ListProductRestockLogsRequest {
  string product_id = 1;
  int32 limit = 2;
  int32 offset = 3;
}
message ListProductRestockLogsResponse {
  repeated ProductRestockLog logs = 1;
  int32 total = 2;
}

message SearchProductsRequest {
  string query = 1;
  int32 limit = 2;
  bool include_inactive = 3;
}
message SearchProductsResponse {
  repeated Product products = 1;
}

// Minimal display ref for resolve-by-IDs name lookups.
message ProductRef {
  string id = 1;
  string name = 2;
  string sku = 3;
}
message ResolveProductsRequest { repeated string ids = 1; }
message ResolveProductsResponse { repeated ProductRef products = 1; }

// Every uploaded image is stored in TWO renditions (see the two-rendition HARD
// RULE in CLAUDE.md): the ORIGINAL (bounded, for a full-size view) and a small
// square THUMB that every list / POS row / fast-load surface reads instead.
// The client produces both — it already has the decoded bitmap on a canvas —
// and the server validates the size cap on each.
enum ProductImageVariant {
  // Unset resolves to THUMB: the fast path is the default, and callers must
  // opt in to shipping the heavy original.
  PRODUCT_IMAGE_VARIANT_UNSPECIFIED = 0;
  PRODUCT_IMAGE_VARIANT_THUMB = 1;
  PRODUCT_IMAGE_VARIANT_ORIGINAL = 2;
}

// Bytes ride inline rather than through a separate upload endpoint: both
// renditions are downscaled client-side and capped by the handler
// (MaxProductImageBytes / MaxProductImageThumbBytes), so this stays a normal
// unary message. One picture per product — re-uploading replaces it.
message UploadProductImageRequest {
  string product_id   = 1;
  bytes  image_data   = 2;  // ORIGINAL rendition (bounded, not the raw camera file)
  bytes  thumb_data   = 3;  // THUMB rendition — required, not optional
  string content_type = 4;  // applies to both renditions
}
message UploadProductImageResponse {
  int64 image_updated_at = 1;
}

message GetProductImageRequest {
  string product_id = 1;
  // Which rendition to return. Unset = THUMB.
  ProductImageVariant variant = 2;
}
message GetProductImageResponse {
  bytes  image_data   = 1;  // the requested rendition
  string content_type = 2;
  // 0 when the product has no picture (image_data is then empty too — absence
  // is NOT an error, so the UI renders its placeholder without a catch).
  int64  image_updated_at = 3;
  ProductImageVariant variant = 4;  // echoes what was actually returned
}

message DeleteProductImageRequest { string product_id = 1; }
message DeleteProductImageResponse {}

message ListLowStockRequest {
  int32 limit = 1;
  int32 offset = 2;
}
message ListLowStockResponse {
  repeated Product products = 1;     // ready_stock set (active warehouse)
  int32 threshold = 2;                 // the current low_stock_threshold setting
  int32 total = 3;                     // ALL matching products, ignoring the page window (bell badge)
}
