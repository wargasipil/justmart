syntax = "proto3";

package inventory_iface.v1;

import "auth_iface/v1/policy.proto";
import "inventory_iface/v1/product.proto";

option go_package = "github.com/justmart/backend/gen/inventory_iface/v1;inventoryifacev1";

// Where a lot's expiry date came from. The date alone cannot say whether
// anybody read it off the pack, and that is exactly what a shelf check needs to
// know: a DEFAULT date is the product's estimate, carried over because nobody
// typed over it.
enum ExpirySource {
  EXPIRY_SOURCE_UNSPECIFIED = 0; // treated as ENTERED (every lot before 00062)
  EXPIRY_SOURCE_ENTERED = 1;     // typed by a person, or confirmed later
  EXPIRY_SOURCE_DEFAULT = 2;     // the product's default, accepted unchanged at receive
  EXPIRY_SOURCE_NONE = 3;        // the goods do not expire; the stored date is a placeholder
}

message Batch {
  string id = 1;
  string product_id = 2;
  string supplier_id = 3;
  string batch_number = 4;
  string expiry_date = 5;
  int64 cost_price = 6;
  string received_at = 7;
  int64 current_quantity = 8;
  int64 created_at = 9;
  // PO that originated this batch via its receipt (empty for legacy / manual
  // CreateBatch path). Populated as display-only enrichment in ListBatches.
  string purchase_order_id = 10;
  string po_no = 11;
  // Owning product's name. Populated as display-only enrichment in
  // SearchBatches so pickers can show a human-readable medicine label.
  string product_name = 12;
  // Owning product's active units of measure (base first). Populated as
  // enrichment in SearchBatches so a picker can offer per-line unit entry
  // (e.g. transfer "2 box"). Stock/qty stay in base units.
  repeated ProductUnit units = 13;
  // Owning product's image version (its image_updated_at, unix sec; 0 = no
  // picture). Display-only enrichment from the same SearchBatches join that
  // fills product_name, so a picker row can render <ProductImage> without a
  // second round trip. 0 makes the client skip the image fetch entirely.
  int64 product_image_updated_at = 14;
  // Who MADE this lot, as recorded on the purchase-order line it arrived on.
  // Empty on every batch created before the column existed and on the manual
  // CreateBatch path -- the fact was never captured, and filling it in from
  // the product's current maker would invent provenance. This is the ONLY
  // place the maker of physical stock is recorded: the product's own list
  // says who MAY make it, this says who DID.
  string manufacturer_id = 15;
  // Where expiry_date came from. NONE means the date is the no-expiry
  // placeholder and should be shown as "does not expire", not as a date.
  ExpirySource expiry_source = 16;
}

service BatchService {
  rpc ListBatches(ListBatchesRequest) returns (ListBatchesResponse) {
    option (auth_iface.v1.allowed_roles) = ROLE_OWNER;
    option (auth_iface.v1.allowed_roles) = ROLE_PHARMACIST;
    option (auth_iface.v1.allowed_roles) = ROLE_CASHIER;
    option (auth_iface.v1.allowed_roles) = ROLE_APOTEKER;
  }
  rpc GetBatch(GetBatchRequest) returns (GetBatchResponse) {
    option (auth_iface.v1.allowed_roles) = ROLE_OWNER;
    option (auth_iface.v1.allowed_roles) = ROLE_PHARMACIST;
    option (auth_iface.v1.allowed_roles) = ROLE_CASHIER;
    option (auth_iface.v1.allowed_roles) = ROLE_APOTEKER;
  }
  rpc CreateBatch(CreateBatchRequest) returns (CreateBatchResponse) {
    option (auth_iface.v1.allowed_roles) = ROLE_OWNER;
    option (auth_iface.v1.allowed_roles) = ROLE_PHARMACIST;
  }
  // ImportStock bulk-creates opening-stock batches from a parsed CSV (first-time
  // offline inventory migration). SKU-keyed, best-effort, per-row results; each
  // row creates one batch + a PURCHASE movement into the active warehouse.
  rpc ImportStock(ImportStockRequest) returns (ImportStockResponse) {
    option (auth_iface.v1.allowed_roles) = ROLE_OWNER;
    option (auth_iface.v1.allowed_roles) = ROLE_PHARMACIST;
  }
  rpc UpdateBatch(UpdateBatchRequest) returns (UpdateBatchResponse) {
    option (auth_iface.v1.allowed_roles) = ROLE_OWNER;
    option (auth_iface.v1.allowed_roles) = ROLE_PHARMACIST;
  }
  rpc SearchBatches(SearchBatchesRequest) returns (SearchBatchesResponse) {
    option (auth_iface.v1.allowed_roles) = ROLE_OWNER;
    option (auth_iface.v1.allowed_roles) = ROLE_PHARMACIST;
    option (auth_iface.v1.allowed_roles) = ROLE_CASHIER;
    option (auth_iface.v1.allowed_roles) = ROLE_APOTEKER;
  }
  // ResolveBatches returns minimal display refs for a set of ids (batch
  // lookup-by-IDs for name resolution; never a full-list preload).
  rpc ResolveBatches(ResolveBatchesRequest) returns (ResolveBatchesResponse) {
    option (auth_iface.v1.allowed_roles) = ROLE_OWNER;
    option (auth_iface.v1.allowed_roles) = ROLE_PHARMACIST;
    option (auth_iface.v1.allowed_roles) = ROLE_CASHIER;
    option (auth_iface.v1.allowed_roles) = ROLE_APOTEKER;
  }
  // SetBatchExpiry corrects or confirms a received lot's expiry, with a
  // required reason; ListBatchExpiryChanges is that lot's history of them.
  // Manager-only, same as creating a lot.
  rpc SetBatchExpiry(SetBatchExpiryRequest) returns (SetBatchExpiryResponse) {
    option (auth_iface.v1.allowed_roles) = ROLE_OWNER;
    option (auth_iface.v1.allowed_roles) = ROLE_PHARMACIST;
  }
  rpc ListBatchExpiryChanges(ListBatchExpiryChangesRequest) returns (ListBatchExpiryChangesResponse) {
    option (auth_iface.v1.allowed_roles) = ROLE_OWNER;
    option (auth_iface.v1.allowed_roles) = ROLE_PHARMACIST;
  }
}

message ListBatchesRequest {
  string product_id = 1;
  bool only_in_stock = 2;
  int32 limit = 3;
  int32 offset = 4;
  string query = 5;        // ILIKE batch_number / product name / sku
  int64 from_unix = 6;     // date-range lower bound (0 = unbounded)
  int64 to_unix = 7;       // date-range upper bound (exclusive; 0 = unbounded)
  string date_field = 8;   // which date the range filters: "received" | "expiry"
  string supplier_id = 9;  // optional supplier ID filter
  string manufacturer_id = 10; // optional pabrik filter (the lot's own maker)
  // Optional: only lots whose expiry came from this source. DEFAULT is the
  // shelf-check worklist -- dates nobody has read off the pack yet.
  ExpirySource expiry_source = 11;
}
message ListBatchesResponse {
  repeated Batch batches = 1;
  int32 total = 2;
}

message GetBatchRequest { string id = 1; }
message GetBatchResponse { Batch batch = 1; }

message CreateBatchRequest {
  string product_id = 1;
  string supplier_id = 2;
  string batch_number = 3;
  string expiry_date = 4;
  int64 cost_price = 5;
  string received_at = 6;
  int64 initial_quantity = 7;
  // Who MADE this lot. Optional, and ARCHIVED makers are accepted here unlike
  // on a product's approved-source list: this records what happened, and old
  // stock entered by hand may well come from a factory since retired.
  string manufacturer_id = 8;
  // Where expiry_date came from (UNSPECIFIED = ENTERED). NONE stores the
  // no-expiry placeholder and ignores expiry_date.
  ExpirySource expiry_source = 9;
}
message CreateBatchResponse { Batch batch = 1; }

// One opening-stock row (CSV), keyed by SKU. The server resolves the product.
message ImportStockRow {
  string sku = 1;
  int64 quantity = 2;       // in `unit` if set, else base units; must be > 0
  string unit = 3;          // optional pack name (resolved to a product unit → ×factor)
  int64 cost_price = 4;     // per BASE unit, minor units; optional (default 0)
  string batch_number = 5;  // optional
  string expiry_date = 6;   // optional YYYY-MM-DD; blank => far-future (non-expiring)
  // Who MADE the lot, by the pabrik CODE -- a CSV is hand-authored, so it is
  // keyed by business codes like `sku` and `unit`, never by a UUID. Optional;
  // an archived pabrik is accepted, since opening stock is history.
  string manufacturer_code = 7;
}
// Per-row outcome of a stock import.
enum ImportStockStatus {
  IMPORT_STOCK_STATUS_UNSPECIFIED = 0;
  IMPORT_STOCK_STATUS_CREATED = 1;
  IMPORT_STOCK_STATUS_SKIPPED_EXISTS = 2; // a batch with that (product, batch_number) already exists
  IMPORT_STOCK_STATUS_ERROR = 3;          // validation / lookup / DB error (see message)
}
message ImportStockResult {
  int32 row = 1;                 // 0-based index into the request rows
  string sku = 2;
  ImportStockStatus status = 3;
  string batch_id = 4;           // set when CREATED
  string message = 5;            // reason when ERROR
}
message ImportStockRequest { repeated ImportStockRow rows = 1; }
message ImportStockResponse {
  repeated ImportStockResult results = 1; // one per input row, in order
  int32 created = 2;
  int32 skipped = 3;
  int32 errored = 4;
}

message UpdateBatchRequest {
  string id = 1;
  string supplier_id = 2;
  string batch_number = 3;
  string expiry_date = 4;
  int64 cost_price = 5;
  string received_at = 6;
}
message UpdateBatchResponse { Batch batch = 1; }

message SearchBatchesRequest {
  string query = 1;
  int32 limit = 2;
  string product_id = 3;     // optional scope: search within a single product's batches
  string warehouse_id = 4;   // optional: scope current_quantity to this warehouse (empty = active warehouse)
  bool only_in_stock = 5;    // when true, only return batches with stock in the scoped warehouse
}
message SearchBatchesResponse {
  repeated Batch batches = 1;
}

// Minimal display ref for resolve-by-IDs name lookups (joins products for the name).
message BatchRef {
  string id = 1;
  string batch_number = 2;
  string product_id = 3;
  string product_name = 4;
}
message ResolveBatchesRequest { repeated string ids = 1; }
message ResolveBatchesResponse { repeated BatchRef batches = 1; }

// Correct (or confirm) a lot's expiry after it was received. Changes ONLY the
// expiry -- UpdateBatch rewrites every field, so a caller holding just a date
// would zero the lot's cost. Every change is kept in batch_expiry_changes.
message SetBatchExpiryRequest {
  string batch_id = 1;
  string expiry_date = 2;          // YYYY-MM-DD; ignored when expiry_source = NONE
  // ENTERED (or UNSPECIFIED) for a date read off the pack, NONE for goods that
  // do not expire. DEFAULT is refused: an edit is always a person's decision.
  ExpirySource expiry_source = 3;
  string reason = 4;               // required
}
message SetBatchExpiryResponse { Batch batch = 1; }

message BatchExpiryChange {
  string id = 1;
  string batch_id = 2;
  string old_expiry_date = 3;      // YYYY-MM-DD
  ExpirySource old_expiry_source = 4;
  string new_expiry_date = 5;      // YYYY-MM-DD
  ExpirySource new_expiry_source = 6;
  string reason = 7;
  string changed_by = 8;           // user id; resolve via ResolveUsers
  int64 changed_at = 9;            // unix
}
message ListBatchExpiryChangesRequest {
  string batch_id = 1;
  int32 limit = 2;
  int32 offset = 3;
}
message ListBatchExpiryChangesResponse {
  repeated BatchExpiryChange changes = 1;
  int32 total = 2;
}
