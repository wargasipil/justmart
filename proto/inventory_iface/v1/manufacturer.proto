syntax = "proto3";

package inventory_iface.v1;

import "auth_iface/v1/policy.proto";

option go_package = "github.com/justmart/backend/gen/inventory_iface/v1;inventoryifacev1";

// A manufacturer ("pabrik") is who MADE the goods — as distinct from the
// supplier ("pemasok"), who SOLD them to this shop. One pabrik reaches a shop
// through several distributors, and one distributor carries many pabrik, so
// the two cannot share a table: a shop that buys Panadol from three PBFs still
// has one manufacturer for it.
//
// Deliberately NOT modelled here: bank / rekening details. A shop pays the
// distributor, never the factory, so those fields belong on Supplier only.
message Manufacturer {
  string id = 1;
  string code = 2;          // unique business code, e.g. "MFR-0001"
  string name = 3;
  string address = 4;       // alamat pabrik
  string phone = 5;
  string contact_email = 6;
  string note = 7;          // free-text: principal, izin edar, whatever the shop tracks
  bool active = 8;
  int64 created_at = 9;
}

service ManufacturerService {
  rpc ListManufacturers(ListManufacturersRequest) returns (ListManufacturersResponse) {
    option (auth_iface.v1.allowed_roles) = ROLE_OWNER;
    option (auth_iface.v1.allowed_roles) = ROLE_PHARMACIST;
  }
  // GetManufacturersSummary counts every manufacturer matching the same
  // filters as ListManufacturers — not the current page. Drives the stat row
  // above the list.
  rpc GetManufacturersSummary(GetManufacturersSummaryRequest) returns (GetManufacturersSummaryResponse) {
    option (auth_iface.v1.allowed_roles) = ROLE_OWNER;
    option (auth_iface.v1.allowed_roles) = ROLE_PHARMACIST;
  }
  rpc GetManufacturer(GetManufacturerRequest) returns (GetManufacturerResponse) {
    option (auth_iface.v1.allowed_roles) = ROLE_OWNER;
    option (auth_iface.v1.allowed_roles) = ROLE_PHARMACIST;
  }
  rpc CreateManufacturer(CreateManufacturerRequest) returns (CreateManufacturerResponse) {
    option (auth_iface.v1.allowed_roles) = ROLE_OWNER;
    option (auth_iface.v1.allowed_roles) = ROLE_PHARMACIST;
  }
  rpc UpdateManufacturer(UpdateManufacturerRequest) returns (UpdateManufacturerResponse) {
    option (auth_iface.v1.allowed_roles) = ROLE_OWNER;
    option (auth_iface.v1.allowed_roles) = ROLE_PHARMACIST;
  }
  rpc ArchiveManufacturer(ArchiveManufacturerRequest) returns (ArchiveManufacturerResponse) {
    option (auth_iface.v1.allowed_roles) = ROLE_OWNER;
    option (auth_iface.v1.allowed_roles) = ROLE_PHARMACIST;
  }
  rpc UnarchiveManufacturer(UnarchiveManufacturerRequest) returns (UnarchiveManufacturerResponse) {
    option (auth_iface.v1.allowed_roles) = ROLE_OWNER;
    option (auth_iface.v1.allowed_roles) = ROLE_PHARMACIST;
  }
  rpc SearchManufacturers(SearchManufacturersRequest) returns (SearchManufacturersResponse) {
    option (auth_iface.v1.allowed_roles) = ROLE_OWNER;
    option (auth_iface.v1.allowed_roles) = ROLE_PHARMACIST;
  }
  // ResolveManufacturers returns minimal display refs for a set of ids (batch
  // lookup-by-IDs for name resolution; never a full-list preload).
  //
  // ALL FOUR ROLES, unlike every other RPC here. The product detail page shows
  // "Pabrik" and is open to the till (see "The catalog pages are open to the
  // till"), so a cashier resolving that one id must not be refused. What comes
  // back is id/code/name — no cost, no supplier, nothing the cost-visibility
  // policy covers. SearchManufacturers stays manager-only: a cashier reads a
  // maker's name, it never picks one.
  rpc ResolveManufacturers(ResolveManufacturersRequest) returns (ResolveManufacturersResponse) {
    option (auth_iface.v1.allowed_roles) = ROLE_OWNER;
    option (auth_iface.v1.allowed_roles) = ROLE_PHARMACIST;
    option (auth_iface.v1.allowed_roles) = ROLE_CASHIER;
    option (auth_iface.v1.allowed_roles) = ROLE_APOTEKER;
  }
  // ListManufacturerProducts returns the catalog this pabrik makes, paginated.
  // This is what earns the manufacturer a detail page at all: without it a
  // manufacturer is seven scalar fields, which the edit drawer already shows.
  // Backed (once implemented) by products.manufacturer_id.
  rpc ListManufacturerProducts(ListManufacturerProductsRequest) returns (ListManufacturerProductsResponse) {
    option (auth_iface.v1.allowed_roles) = ROLE_OWNER;
    option (auth_iface.v1.allowed_roles) = ROLE_PHARMACIST;
  }
}

message ListManufacturersRequest {
  bool include_inactive = 1;
  int32 limit = 2;
  int32 offset = 3;
  string query = 4;          // optional ILIKE name / code
}
message ListManufacturersResponse {
  repeated Manufacturer manufacturers = 1;
  int32 total = 2;
}

// Same filter set as ListManufacturersRequest, minus paging — the summary
// counts every matching manufacturer, not a page. Keep the two in sync: the
// list and the stat row above it must always describe the same set.
message GetManufacturersSummaryRequest {
  bool include_inactive = 1;
  string query = 2;
}
message GetManufacturersSummaryResponse {
  int64 total_manufacturers = 1;
}

message GetManufacturerRequest { string id = 1; }
message GetManufacturerResponse { Manufacturer manufacturer = 1; }

message CreateManufacturerRequest {
  string code = 1;
  string name = 2;
  string address = 3;
  string phone = 4;
  string contact_email = 5;
  string note = 6;
}
message CreateManufacturerResponse { Manufacturer manufacturer = 1; }

message UpdateManufacturerRequest {
  string id = 1;
  string code = 2;
  string name = 3;
  string address = 4;
  string phone = 5;
  string contact_email = 6;
  string note = 7;
}
message UpdateManufacturerResponse { Manufacturer manufacturer = 1; }

message ArchiveManufacturerRequest { string id = 1; }
message ArchiveManufacturerResponse { Manufacturer manufacturer = 1; }

message UnarchiveManufacturerRequest { string id = 1; }
message UnarchiveManufacturerResponse { Manufacturer manufacturer = 1; }

message SearchManufacturersRequest {
  string query = 1;
  int32 limit = 2;
}
message SearchManufacturersResponse {
  repeated Manufacturer manufacturers = 1;
}

// Minimal display ref for resolve-by-IDs name lookups.
message ManufacturerRef {
  string id = 1;
  string code = 2;
  string name = 3;
}
message ResolveManufacturersRequest { repeated string ids = 1; }
message ResolveManufacturersResponse { repeated ManufacturerRef manufacturers = 1; }

// One product this pabrik makes. Denormalized rather than the full Product:
// the row is display-only, and Product carries cost fields that would then need
// redacting on a read that has no business exposing them.
message ManufacturerProduct {
  string product_id = 1;
  string name = 2;
  string sku = 3;
  string base_unit = 4;      // the product's base unit name ("pcs", "tablet")
  int64 unit_price = 5;      // sell price per base unit, minor units
  int64 ready_stock = 6;     // on hand IN THE CALLER'S ACTIVE WAREHOUSE (resolveWarehouse)
  bool active = 7;
}
message ListManufacturerProductsRequest {
  string manufacturer_id = 1;
  int32 limit = 2;
  int32 offset = 3;
  string query = 4;          // optional ILIKE product name / sku
  bool include_archived = 5;
}
message ListManufacturerProductsResponse {
  repeated ManufacturerProduct products = 1;
  int32 total = 2;
}
