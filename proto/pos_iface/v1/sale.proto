syntax = "proto3";

package pos_iface.v1;

import "auth_iface/v1/policy.proto";

option go_package = "github.com/justmart/backend/gen/pos_iface/v1;posifacev1";

enum PaymentSource {
  PAYMENT_SOURCE_UNSPECIFIED = 0;
  PAYMENT_SOURCE_CASH = 1;
  PAYMENT_SOURCE_NON_CASH = 2;  // card / QRIS / transfer
}

enum SaleStatus {
  SALE_STATUS_UNSPECIFIED = 0;
  SALE_STATUS_DRAFT = 1;
  SALE_STATUS_COMPLETED = 2;
  SALE_STATUS_VOIDED = 3;
  SALE_STATUS_REFUNDED = 4; // a completed order that was fully refunded
}

message Sale {
  reserved 6;  // removed: tax_invoice_no

  string id = 1;
  string sale_no = 2;
  string customer_id = 3;
  string cashier_user_id = 4;
  PaymentSource payment_source = 5;
  int64 subtotal = 7;
  int64 cart_discount = 8;
  int64 total = 9;
  int64 paid_amount = 10;
  SaleStatus status = 11;
  string branch_id = 12;
  int64 created_at = 13;
  int64 completed_at = 14;
  repeated SaleItem items = 15;
  string prescription_id = 16; // pharmacy mode: attached resep (empty = none)
  string warehouse_id = 17;
  string customer_name = 18;   // denormalized for the order-history list
  int64 biaya_jasa = 19;       // service fee (minor units); added to total, default from the attached resep
  // Cart-level discount. cart_discount (field 8) is the RESOLVED amount (minor
  // units); these carry the persisted "info": cart_discount_value is minor units
  // when FIXED, basis points (percent*100) when PERCENT (empty type => FIXED).
  string cart_discount_type = 20;
  int64 cart_discount_value = 21;
  // Full-order refund (status REFUNDED). All zero/empty unless refunded.
  int64 refunded_at = 22;       // unix; when the order was refunded
  int64 refund_amount = 23;     // amount refunded (= total at refund time)
  string refund_reason = 24;
  bool refund_restocked = 25;   // true = goods returned to stock; false = money-only
}

message SaleItem {
  string id = 1;
  string sale_id = 2;
  string product_id = 3;
  string batch_id = 4;         // unused under multi-unit (per-batch breakdown is on stock_movements)
  int32 qty = 5;               // qty in the selling unit
  int64 unit_price_snapshot = 6;
  int64 line_discount = 7;
  int64 line_total = 8;
  string product_name = 9;    // denormalized for the order-history list
  string product_unit_id = 10;
  string unit_name = 11;       // selling unit name (e.g. "box")
  int64 unit_factor = 12;      // base units per selling unit
  int32 base_qty = 13;         // qty × factor (base units consumed)
  // Per-line discount. line_discount (field 7) is the RESOLVED amount (minor
  // units); these carry the persisted "info": discount_value is minor units when
  // FIXED, basis points (percent*100, e.g. 12.5% = 1250) when PERCENT (empty
  // type => FIXED).
  string discount_type = 14;
  int64 discount_value = 15;
}

service SaleService {
  rpc StartSale(StartSaleRequest) returns (StartSaleResponse) {
    option (auth_iface.v1.allowed_roles) = ROLE_OWNER;
    option (auth_iface.v1.allowed_roles) = ROLE_PHARMACIST;
    option (auth_iface.v1.allowed_roles) = ROLE_CASHIER;
    option (auth_iface.v1.allowed_roles) = ROLE_APOTEKER;
  }
  rpc GetSale(GetSaleRequest) returns (GetSaleResponse) {
    option (auth_iface.v1.allowed_roles) = ROLE_OWNER;
    option (auth_iface.v1.allowed_roles) = ROLE_PHARMACIST;
    option (auth_iface.v1.allowed_roles) = ROLE_CASHIER;
    option (auth_iface.v1.allowed_roles) = ROLE_APOTEKER;
  }
  rpc ListSales(ListSalesRequest) returns (ListSalesResponse) {
    option (auth_iface.v1.allowed_roles) = ROLE_OWNER;
    option (auth_iface.v1.allowed_roles) = ROLE_PHARMACIST;
    option (auth_iface.v1.allowed_roles) = ROLE_CASHIER;
    option (auth_iface.v1.allowed_roles) = ROLE_APOTEKER;
  }
  rpc AddItem(AddItemRequest) returns (AddItemResponse) {
    option (auth_iface.v1.allowed_roles) = ROLE_OWNER;
    option (auth_iface.v1.allowed_roles) = ROLE_PHARMACIST;
    option (auth_iface.v1.allowed_roles) = ROLE_CASHIER;
    option (auth_iface.v1.allowed_roles) = ROLE_APOTEKER;
  }
  rpc SetItemQuantity(SetItemQuantityRequest) returns (SetItemQuantityResponse) {
    option (auth_iface.v1.allowed_roles) = ROLE_OWNER;
    option (auth_iface.v1.allowed_roles) = ROLE_PHARMACIST;
    option (auth_iface.v1.allowed_roles) = ROLE_CASHIER;
    option (auth_iface.v1.allowed_roles) = ROLE_APOTEKER;
  }
  rpc RemoveItem(RemoveItemRequest) returns (RemoveItemResponse) {
    option (auth_iface.v1.allowed_roles) = ROLE_OWNER;
    option (auth_iface.v1.allowed_roles) = ROLE_PHARMACIST;
    option (auth_iface.v1.allowed_roles) = ROLE_CASHIER;
    option (auth_iface.v1.allowed_roles) = ROLE_APOTEKER;
  }
  rpc SetSaleCustomer(SetSaleCustomerRequest) returns (SetSaleCustomerResponse) {
    option (auth_iface.v1.allowed_roles) = ROLE_OWNER;
    option (auth_iface.v1.allowed_roles) = ROLE_PHARMACIST;
    option (auth_iface.v1.allowed_roles) = ROLE_CASHIER;
    option (auth_iface.v1.allowed_roles) = ROLE_APOTEKER;
  }
  // AttachPrescription / DetachPrescription — pharmacy-mode POS flow. Open to
  // everyone who can run POS (the dispensing happens at the till). The Rx
  // *authoring* authority is separate (PrescriptionService Create/Update/Void).
  rpc AttachPrescription(AttachPrescriptionRequest) returns (AttachPrescriptionResponse) {
    option (auth_iface.v1.allowed_roles) = ROLE_OWNER;
    option (auth_iface.v1.allowed_roles) = ROLE_PHARMACIST;
    option (auth_iface.v1.allowed_roles) = ROLE_CASHIER;
    option (auth_iface.v1.allowed_roles) = ROLE_APOTEKER;
  }
  rpc DetachPrescription(DetachPrescriptionRequest) returns (DetachPrescriptionResponse) {
    option (auth_iface.v1.allowed_roles) = ROLE_OWNER;
    option (auth_iface.v1.allowed_roles) = ROLE_PHARMACIST;
    option (auth_iface.v1.allowed_roles) = ROLE_CASHIER;
    option (auth_iface.v1.allowed_roles) = ROLE_APOTEKER;
  }
  // SetServiceFee overrides the sale's biaya jasa (service fee) at the till. The
  // value defaults from the attached resep on AttachPrescription; this lets the
  // cashier adjust it. DRAFT only.
  rpc SetServiceFee(SetServiceFeeRequest) returns (SetServiceFeeResponse) {
    option (auth_iface.v1.allowed_roles) = ROLE_OWNER;
    option (auth_iface.v1.allowed_roles) = ROLE_PHARMACIST;
    option (auth_iface.v1.allowed_roles) = ROLE_CASHIER;
    option (auth_iface.v1.allowed_roles) = ROLE_APOTEKER;
  }
  // SetLineDiscount sets a per-item discount (FIXED amount or PERCENT) on a cart
  // line and recomputes the line + sale totals. DRAFT only.
  rpc SetLineDiscount(SetLineDiscountRequest) returns (SetLineDiscountResponse) {
    option (auth_iface.v1.allowed_roles) = ROLE_OWNER;
    option (auth_iface.v1.allowed_roles) = ROLE_PHARMACIST;
    option (auth_iface.v1.allowed_roles) = ROLE_CASHIER;
    option (auth_iface.v1.allowed_roles) = ROLE_APOTEKER;
  }
  // SetCartDiscount sets a subtotal-level discount (FIXED amount or PERCENT) on
  // the sale and recomputes the total. DRAFT only.
  rpc SetCartDiscount(SetCartDiscountRequest) returns (SetCartDiscountResponse) {
    option (auth_iface.v1.allowed_roles) = ROLE_OWNER;
    option (auth_iface.v1.allowed_roles) = ROLE_PHARMACIST;
    option (auth_iface.v1.allowed_roles) = ROLE_CASHIER;
    option (auth_iface.v1.allowed_roles) = ROLE_APOTEKER;
  }
  rpc CompleteSale(CompleteSaleRequest) returns (CompleteSaleResponse) {
    option (auth_iface.v1.allowed_roles) = ROLE_OWNER;
    option (auth_iface.v1.allowed_roles) = ROLE_PHARMACIST;
    option (auth_iface.v1.allowed_roles) = ROLE_CASHIER;
    option (auth_iface.v1.allowed_roles) = ROLE_APOTEKER;
  }
  rpc VoidSale(VoidSaleRequest) returns (VoidSaleResponse) {
    option (auth_iface.v1.allowed_roles) = ROLE_OWNER;
    option (auth_iface.v1.allowed_roles) = ROLE_PHARMACIST;
    option (auth_iface.v1.allowed_roles) = ROLE_CASHIER;
    option (auth_iface.v1.allowed_roles) = ROLE_APOTEKER;
  }
  // DiscardSale hard-deletes a DRAFT sale (and its items). Used for abandoned
  // POS carts so they leave no VOIDED trace. Only DRAFT sales are discardable.
  rpc DiscardSale(DiscardSaleRequest) returns (DiscardSaleResponse) {
    option (auth_iface.v1.allowed_roles) = ROLE_OWNER;
    option (auth_iface.v1.allowed_roles) = ROLE_PHARMACIST;
    option (auth_iface.v1.allowed_roles) = ROLE_CASHIER;
    option (auth_iface.v1.allowed_roles) = ROLE_APOTEKER;
  }
  // RefundSale fully refunds a COMPLETED order: flips it to REFUNDED, optionally
  // returns its goods to stock (RETURN movements) and reverses pharmacy Rx
  // dispensing, and records the refunded amount. Manager-tier (money + stock
  // reversal) — OWNER + PHARMACIST only, unlike the DRAFT-only VoidSale.
  rpc RefundSale(RefundSaleRequest) returns (RefundSaleResponse) {
    option (auth_iface.v1.allowed_roles) = ROLE_OWNER;
    option (auth_iface.v1.allowed_roles) = ROLE_PHARMACIST;
  }
  rpc GetTodaySnapshot(GetTodaySnapshotRequest) returns (GetTodaySnapshotResponse) {
    option (auth_iface.v1.allowed_roles) = ROLE_OWNER;
    option (auth_iface.v1.allowed_roles) = ROLE_PHARMACIST;
    option (auth_iface.v1.allowed_roles) = ROLE_CASHIER;
    option (auth_iface.v1.allowed_roles) = ROLE_APOTEKER;
  }
  rpc GetSalesSummary(GetSalesSummaryRequest) returns (GetSalesSummaryResponse) {
    option (auth_iface.v1.allowed_roles) = ROLE_OWNER;
    option (auth_iface.v1.allowed_roles) = ROLE_PHARMACIST;
    option (auth_iface.v1.allowed_roles) = ROLE_CASHIER;
    option (auth_iface.v1.allowed_roles) = ROLE_APOTEKER;
  }
  // GetMyPerformance returns the CALLER's own COMPLETED-sales metrics (revenue,
  // sale count, items sold) bucketed over a date range. Always self-scoped from
  // the principal — there is no cashier param — and it carries NO profit/COGS,
  // so it can never leak cost basis or another cashier's data. Cashier-facing.
  rpc GetMyPerformance(GetMyPerformanceRequest) returns (GetMyPerformanceResponse) {
    option (auth_iface.v1.allowed_roles) = ROLE_CASHIER;
    option (auth_iface.v1.allowed_roles) = ROLE_APOTEKER;
  }
  rpc PrintReceipt(PrintReceiptRequest) returns (PrintReceiptResponse) {
    option (auth_iface.v1.allowed_roles) = ROLE_OWNER;
    option (auth_iface.v1.allowed_roles) = ROLE_PHARMACIST;
    option (auth_iface.v1.allowed_roles) = ROLE_CASHIER;
    option (auth_iface.v1.allowed_roles) = ROLE_APOTEKER;
  }
}

message StartSaleRequest {}
message StartSaleResponse { Sale sale = 1; }

message GetSaleRequest { string id = 1; }
message GetSaleResponse { Sale sale = 1; }

message ListSalesRequest {
  int64 from_unix = 1;
  int64 to_unix = 2;
  SaleStatus status = 3;
  int32 limit = 4;
  int32 offset = 5;
  string query = 6;          // ILIKE sale_no / customer name / product name
  // Optional cashier-scope filter. OWNER/PHARMACIST may set it to narrow to one
  // cashier (empty = all). CASHIER/APOTEKER are forced to their own id
  // server-side and may not request another's (InvalidArgument).
  string cashier_user_id = 7;
}
message ListSalesResponse {
  repeated Sale sales = 1;
  int32 total = 2;
}

message AddItemRequest {
  string sale_id = 1;
  string product_id = 2;
  int32 qty = 3;                // qty in the chosen unit
  string product_unit_id = 4; // selling unit; empty = the product's base unit
}
message AddItemResponse { Sale sale = 1; }

message SetItemQuantityRequest {
  string sale_id = 1;
  string item_id = 2;
  int32 qty = 3;
}
message SetItemQuantityResponse { Sale sale = 1; }

message RemoveItemRequest {
  string sale_id = 1;
  string item_id = 2;
}
message RemoveItemResponse { Sale sale = 1; }

message SetSaleCustomerRequest {
  string sale_id = 1;
  string customer_id = 2;
}
message SetSaleCustomerResponse { Sale sale = 1; }

message AttachPrescriptionRequest {
  string sale_id = 1;
  string prescription_id = 2;
}
message AttachPrescriptionResponse { Sale sale = 1; }

message DetachPrescriptionRequest {
  string sale_id = 1;
}
message DetachPrescriptionResponse { Sale sale = 1; }

message SetServiceFeeRequest {
  string sale_id = 1;
  int64 biaya_jasa = 2; // service fee in minor units (>= 0)
}
message SetServiceFeeResponse { Sale sale = 1; }

message SetLineDiscountRequest {
  string sale_id = 1;
  string item_id = 2;
  string discount_type = 3;   // 'FIXED' (default) | 'PERCENT'
  int64 discount_value = 4;   // FIXED=minor units; PERCENT=basis points (percent*100); >= 0
}
message SetLineDiscountResponse { Sale sale = 1; }

message SetCartDiscountRequest {
  string sale_id = 1;
  string discount_type = 2;   // 'FIXED' (default) | 'PERCENT'
  int64 discount_value = 3;   // FIXED=minor units; PERCENT=basis points (percent*100); >= 0
}
message SetCartDiscountResponse { Sale sale = 1; }

message CompleteSaleRequest {
  string sale_id = 1;
  PaymentSource payment_source = 2;
  int64 paid_amount = 3;
}
message CompleteSaleResponse { Sale sale = 1; }

message VoidSaleRequest {
  string sale_id = 1;
}
message VoidSaleResponse { Sale sale = 1; }

message DiscardSaleRequest {
  string sale_id = 1;
}
message DiscardSaleResponse {}

message RefundSaleRequest {
  string sale_id = 1;
  string reason = 2;   // optional free-text reason recorded on the sale
  bool restock = 3;    // true = return goods to stock (RETURN movements) + reverse Rx; false = money-only
}
message RefundSaleResponse { Sale sale = 1; }

message GetTodaySnapshotRequest {
  // Optional cashier-scope filter. Empty = include every cashier (OWNER /
  // PHARMACIST view). Set = only sales by that cashier (CASHIER view passes
  // their own user id). Non-OWNER callers may only pass their own id.
  string cashier_user_id = 1;
}
message GetTodaySnapshotResponse {
  int64  revenue          = 1;
  int64  sale_count       = 2;
  int64  items_sold       = 3;
  string top_product_id  = 4;
  int64  top_product_qty = 5;
  // Unix seconds of the latest completed_at matching the filters, or 0 if
  // no qualifying sale today.
  int64  last_sale_unix   = 6;
}

// Aggregate over the SAME filters as ListSales (status + date range + search),
// across ALL matching rows — not just one page. Backs the order-history
// summary bar; the list itself stays server-paginated via ListSales.
message GetSalesSummaryRequest {
  int64 from_unix = 1;
  int64 to_unix = 2;
  SaleStatus status = 3;
  string query = 4;          // ILIKE sale_no / customer name / product name
  // Optional cashier-scope filter — same rules as ListSalesRequest.cashier_user_id.
  string cashier_user_id = 5;
}
message GetSalesSummaryResponse {
  int64 sale_count = 1;
  int64 items_sold = 2;      // SUM(sale_items.qty)
  int64 revenue = 3;         // SUM(sales.total)
}

enum PerformanceGranularity {
  PERFORMANCE_GRANULARITY_UNSPECIFIED = 0;  // treated as DAY
  PERFORMANCE_GRANULARITY_DAY         = 1;
  PERFORMANCE_GRANULARITY_WEEK        = 2;
  PERFORMANCE_GRANULARITY_MONTH       = 3;
}

message GetMyPerformanceRequest {
  int64 from_unix = 1;                        // completed_at >= from (default: now-30d)
  int64 to_unix   = 2;                        // completed_at <  to (default: now)
  PerformanceGranularity granularity = 3;
}

// One time bucket of the caller's own COMPLETED sales. Deliberately carries NO
// profit/COGS field — there is nothing to populate, so cost can never leak.
message PerformanceBucket {
  string day_key     = 1;  // "YYYY-MM-DD" | "YYYY-Www" (ISO) | "YYYY-MM"
  int64  revenue     = 2;  // SUM(sales.total)
  int64  sales_count = 3;  // COUNT of COMPLETED sales
  int64  items_sold  = 4;  // SUM(sale_items.base_qty) — base-unit qty
}

message GetMyPerformanceResponse {
  repeated PerformanceBucket buckets = 1;     // chronological; empty buckets zeroed
  int64 total_revenue     = 2;
  int64 total_sales_count = 3;
  int64 total_items_sold  = 4;
}

message PrintReceiptRequest {
  string sale_id = 1;
  // Optional print target (connector mode). Empty → the server resolves the
  // saved default (app_settings) and falls back to the sole connected device.
  string connector_device_id = 2;
  string printer_name = 3;
}
message PrintReceiptResponse {
  // Echoes the rendered byte length so the client can confirm something
  // actually went out the wire (mostly for debugging).
  int32 bytes_sent = 1;
}
